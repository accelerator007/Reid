<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الصفحة غير موجودة — رِيْد</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg?v=2">
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .nf-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 28px;
      background: linear-gradient(160deg, #F5F5F4 0%, #E5DBE6 60%, #dcd6f2 100%);
    }
    .nf-code {
      font-family: 'Alexandria', sans-serif;
      font-weight: 800;
      font-size: clamp(80px, 18vw, 160px);
      line-height: 1;
      background: linear-gradient(90deg, #7D80DA, #55418B);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 0;
    }
    .nf-wrap h1 {
      font-family: 'Alexandria', sans-serif;
      font-weight: 700;
      font-size: clamp(22px, 4vw, 32px);
      color: #55418B;
      margin: 12px 0 14px;
    }
    .nf-wrap p { color: #625971; font-size: 16px; line-height: 1.9; font-weight: 300; margin: 0 0 32px; max-width: 440px; }
  </style>
</head>
<body>
  <div class="nf-wrap">
    <div>
      <p class="nf-code">404</p>
      <h1>عذرًا، الصفحة غير موجودة</h1>
      <p>ربما تغيّر الرابط أو حُذفت الصفحة. لا بأس — يمكنكم العودة إلى الصفحة الرئيسية والمتابعة من هناك.</p>
      <a href="/" class="btn btn-primary">العودة إلى الرئيسية</a>
    </div>
  </div>
</body>
</html>
