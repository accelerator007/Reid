name: CI
on:
  pull_request: {branches: [develop, main]}
  push: {branches: [develop, 'feature/**']}
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # The WhatsApp assistant runs from server/ and was never covered by CI, so its
  # tests never ran on a pull request.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json}
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      # The deployment image ships no system fonts at all. Building it and
      # generating a real Arabic PDF inside it is the only check that proves
      # reports cannot silently regress to a Latin-only fallback face.
      - run: docker build -t reid-api-ci server
      - name: Arabic PDF renders inside the deployment image
        run: |
          docker run --rm --entrypoint node reid-api-ci --input-type=module -e "
            const {generateArtifact}=await import('./artifacts.mjs');
            const pdf=await generateArtifact('pdf','- بند عربي','تقرير');
            const raw=pdf.buffer.toString('latin1');
            const faces=[...raw.matchAll(/\/BaseFont\s*\/([A-Za-z0-9+\-,#]+)/g)].map(m=>m[1]);
            if(!/\/FontFile2/.test(raw)) throw new Error('no embedded font in the image');
            if(!faces.length||!faces.every(f=>/IBMPlexSansArabic/.test(f))) throw new Error('unexpected face: '+faces);
            console.log('embedded faces:',faces.join(','));
          "

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/secret-scan.mjs
      # The planted value is generated at runtime: committing a literal that the
      # scanner is meant to catch would make the scanner fail on its own repo.
      - name: Secret scan detects a planted credential
        run: |
          planted="$(head -c 200 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 35)"
          printf 'const key = "AIza%s";\n' "$planted" > scripts/__planted.mjs
          git add -N scripts/__planted.mjs
          if node scripts/secret-scan.mjs; then echo "scanner failed to detect a planted key"; exit 1; fi
          git rm -q --cached scripts/__planted.mjs
          rm -f scripts/__planted.mjs
          node scripts/secret-scan.mjs
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm ci
        working-directory: server
      - run: npm audit --omit=dev --audit-level=high
        working-directory: server
      # Runtime credentials live outside the repository. A build context that
      # can see an env file is a leak waiting for the next image push.
      - name: Docker build context excludes environment files
        run: |
          test -f server/.dockerignore
          grep -qx 'node_modules' server/.dockerignore
          grep -qx '.env\*' server/.dockerignore

  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_HOST_AUTH_METHOD: trust}
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Applies every migration to a throwaway database and exercises the RLS
      # policies as real anon/authenticated roles, not through the UI.
      - run: scripts/rls-local.sh

  authenticated-browser:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTH_E2E: '1'
      LIVE_TOOL_E2E: '1'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/authenticated-roles.spec.ts
