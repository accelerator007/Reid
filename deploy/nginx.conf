server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  # Behind the tunnel the internal port is meaningless; keep redirects relative.
  absolute_redirect off;

  location /api/ {
    proxy_pass http://api:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 110s;
    client_max_body_size 32k;
    add_header Cache-Control "no-store" always;
  }

  # Reid Assistant. A variable upstream is resolved per request through
  # Docker's DNS, so the site still starts when the assistant profile is off.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $reid_assistant http://assistant:8095;

  # Phone-provider webhooks. Every request is signature-verified by the service.
  location /voice/ {
    proxy_pass $reid_assistant;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
    client_max_body_size 64k;
  }

  # Desktop assistant API (Reid account required). Voice uploads are small WAVs.
  location /assistant-api/ {
    proxy_pass $reid_assistant;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    client_max_body_size 6m;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Reid no longer runs money through the workspace; keep old bookmarks useful.
  # Mirrors legacyRedirects in src/routes.ts, which only the Worker reads.
  location = /finance { return 301 /today; }
  location = /business { return 301 /crm; }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Reid-Origin "local-reid" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
