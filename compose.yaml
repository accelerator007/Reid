name: reid-local

services:
  api:
    build: ./server
    image: reid-services:local
    container_name: reid-services
    restart: unless-stopped
    env_file: /home/reid/.config/reid-os/service.env
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - qr-session:/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
    depends_on:
      ai-relay:
        condition: service_started
      tts:
        condition: service_healthy
      host-ops:
        condition: service_healthy

  # Private execution boundary for Owner-approved Ubuntu operations. It is
  # reachable only from the Compose network; no host TCP port is published.
  host-ops:
    build: ./infra/host-ops
    image: reid-host-ops:local
    container_name: reid-host-ops
    restart: unless-stopped
    env_file:
      - /home/reid/.config/reid-os/host-ops.env
    privileged: true
    pid: host
    volumes:
      - /:/host
      - /var/run/docker.sock:/var/run/docker.sock
      - host-ops-state:/var/lib/reid-host-ops
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8787/healthz]
      interval: 20s
      timeout: 5s
      retries: 3

  tts:
    build: ./infra/tts
    image: reid-tts:local
    container_name: reid-tts
    restart: unless-stopped
    env_file:
      - /home/reid/.config/reid-os/tts.env
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  ai-relay:
    build:
      context: .
      dockerfile: deploy/ai-relay.Dockerfile
    container_name: reid-ai-relay
    user: "1000:1000"
    restart: unless-stopped
    command: ["-NT", "-o", "BatchMode=yes", "-o", "ExitOnForwardFailure=yes", "-o", "ServerAliveInterval=20", "-o", "ServerAliveCountMax=3", "-o", "StrictHostKeyChecking=yes", "-o", "UserKnownHostsFile=/keys/known_hosts", "-i", "/keys/ai_key", "-L", "0.0.0.0:11436:127.0.0.1:11436", "ai-lap@10.162.46.208"]
    volumes:
      - /home/reid/.config/reid-os/ai_key:/keys/ai_key:ro
      - /home/reid/.config/reid-os/known_hosts:/keys/known_hosts:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  runner:
    image: python:3.12-slim
    container_name: reid-agent-runner
    user: "1000:1000"
    restart: unless-stopped
    profiles: [migrated]
    env_file: /home/reid/.config/reid-os/runner.env
    command: [python, -B, /runner/reid_agent_runner.py]
    volumes:
      - ./infra/ai-lap:/runner:ro
    depends_on: [ai-relay]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER:-96897308003}
        VITE_APP_URL: ${VITE_APP_URL:-https://reidpro.com}
    image: reid-web:local
    container_name: reid-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=1m
    depends_on:
      api:
        condition: service_healthy

  # Reid Assistant (مساعد ريد): emergency alert engine, phone-call webhooks and
  # the desktop assistant API. Source: ../reid-assistant. Opt-in profile so the
  # website never depends on it; nginx resolves it lazily and answers 502 when
  # it is not running.
  assistant:
    build: ../reid-assistant
    image: reid-assistant:local
    container_name: reid-assistant
    restart: unless-stopped
    profiles: [assistant]
    env_file: /home/reid/.config/reid-os/assistant.env
    depends_on: [ai-relay, api]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  tunnel:
    image: cloudflare/cloudflared:2026.9.0
    container_name: reid-tunnel
    user: "0:0"
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./deploy/cloudflared.yml:/etc/cloudflared/config.yml:ro
      - /home/reid/.cloudflared/635939a7-92d1-4e60-a2f4-821eaa167ede.json:/etc/cloudflared/635939a7-92d1-4e60-a2f4-821eaa167ede.json:ro
    security_opt:
      - no-new-privileges:true

volumes:
  qr-session:
  host-ops-state:
